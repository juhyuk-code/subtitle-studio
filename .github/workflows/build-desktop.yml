name: Build desktop apps

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: Subtitle-Studio-macOS
            path: release/Subtitle Studio.app
          - os: windows-2022
            artifact: Subtitle-Studio-Windows
            path: release/Subtitle Studio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python -m pip install -e ".[desktop]"
          else
            .venv/bin/python -m pip install -e ".[desktop]"
          fi
          npm ci
      - name: Build
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
