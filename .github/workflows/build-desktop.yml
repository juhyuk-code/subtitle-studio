name: Build Apple Silicon DMG

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon DMG
    runs-on: macos-15
    env:
      PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: "1"
      PYINSTALLER_VERIFY_BUNDLE_SIGNATURE: "1"
      SUBTITLE_STUDIO_TARGET_ARCH: arm64
      SUBTITLE_STUDIO_VERSION: 0.1.0
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "SUBTITLE_STUDIO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev,desktop]"
          npm ci

      - name: Install portable FFmpeg
        shell: bash
        run: |
          npm install --no-save --package-lock=false ffmpeg-static @ffprobe-installer/ffprobe
          FFMPEG_PATH="$(node -p "require('ffmpeg-static')")"
          FFPROBE_PATH="$(node -p "require('@ffprobe-installer/ffprobe').path")"
          chmod +x "$FFMPEG_PATH" "$FFPROBE_PATH"
          echo "SUBTITLE_STUDIO_FFMPEG=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "SUBTITLE_STUDIO_FFPROBE=$FFPROBE_PATH" >> "$GITHUB_ENV"
          "$FFMPEG_PATH" -hide_banner -filters 2>&1 | grep -E '[[:space:]]subtitles[[:space:]]'
          "$FFMPEG_PATH" -hide_banner -encoders 2>&1 | grep h264_videotoolbox

      - name: Import Apple Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGNING_IDENTITY != ''
        shell: bash
        env:
          CERTIFICATE_P12: ${{ env.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ env.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/subtitle-studio.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/subtitle-studio.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p runner "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p runner "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN_PATH"
          echo "SUBTITLE_STUDIO_CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          npm run test
          .venv/bin/python -m pytest backend/tests

      - name: Build
        run: npm run desktop:build

      - name: Verify and smoke-test app
        shell: bash
        run: |
          APP="release/Subtitle Studio.app"
          test -x "$APP/Contents/MacOS/Subtitle Studio"
          test -x "$APP/Contents/Frameworks/bin/ffmpeg" || test -x "$APP/Contents/Resources/bin/ffmpeg"
          test -f "$APP/Contents/Resources/docs/QUICK_START_KO.md"
          test -f "$APP/Contents/Resources/docs/USER_MANUAL.md"
          test -f "$APP/Contents/Resources/dist/index.html"
          find "$APP/Contents/Resources/dist/assets" -name '*Pretendard*.woff2' -print -quit | grep .
          plutil -lint "$APP/Contents/Info.plist"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleIdentifier)" = "com.subtitlestudio.desktop"
          test "$(lipo -archs "$APP/Contents/MacOS/Subtitle Studio")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/Frameworks/bin/ffmpeg" -hide_banner -filters 2>&1 | grep -E '[[:space:]]subtitles[[:space:]]'
          "$APP/Contents/Frameworks/bin/ffmpeg" -hide_banner -encoders 2>&1 | grep h264_videotoolbox
          "$APP/Contents/MacOS/Subtitle Studio" --package-self-test
          "$APP/Contents/MacOS/Subtitle Studio" > "$RUNNER_TEMP/subtitle-studio-smoke.log" 2>&1 &
          APP_PID=$!
          sleep 15
          if ! kill -0 "$APP_PID"; then
            cat "$RUNNER_TEMP/subtitle-studio-smoke.log"
            exit 1
          fi
          kill "$APP_PID" || true
          wait "$APP_PID" || true

      - name: Notarize app
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        shell: bash
        run: |
          ditto -c -k --keepParent "release/Subtitle Studio.app" "$RUNNER_TEMP/Subtitle-Studio-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Subtitle-Studio-notary.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "release/Subtitle Studio.app"
          xcrun stapler validate "release/Subtitle Studio.app"
          spctl --assess --type execute --verbose=2 "release/Subtitle Studio.app"

      - name: Create drag-and-drop DMG
        shell: bash
        run: |
          DMG_ROOT="$RUNNER_TEMP/subtitle-studio-dmg"
          mkdir -p "$DMG_ROOT"
          ditto "release/Subtitle Studio.app" "$DMG_ROOT/Subtitle Studio.app"
          cp QUICK_START_KO.md "$DMG_ROOT/Subtitle Studio Korean Quick Start.md"
          cp USER_MANUAL.md "$DMG_ROOT/Subtitle Studio User Manual.md"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "Subtitle Studio" -srcfolder "$DMG_ROOT" \
            -ov -format UDZO "release/Subtitle-Studio-macOS-arm64.dmg"

      - name: Sign and notarize DMG
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
        run: |
          DMG="release/Subtitle-Studio-macOS-arm64.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Write checksum
        shell: bash
        run: |
          cd release
          shasum -a 256 Subtitle-Studio-macOS-arm64.dmg > Subtitle-Studio-macOS-arm64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Studio-macOS-Apple-Silicon
          path: |
            release/Subtitle-Studio-macOS-arm64.dmg
            release/Subtitle-Studio-macOS-arm64.sha256
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish Apple Silicon DMG
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@v4
        with:
          name: Subtitle-Studio-macOS-Apple-Silicon
          path: release-assets

      - name: Verify installer and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/Subtitle-Studio-macOS-arm64.dmg
          test -f release-assets/Subtitle-Studio-macOS-arm64.sha256
          (cd release-assets && sha256sum --check Subtitle-Studio-macOS-arm64.sha256)

      - name: Write installation notes
        shell: bash
        run: |
          cat > release-installation.md <<'EOF'
          ## Install on Apple Silicon Mac

          1. Download `Subtitle-Studio-macOS-arm64.dmg`.
          2. Open the DMG.
          3. Drag **Subtitle Studio** onto the **Applications** shortcut.
          4. Open **Subtitle Studio** from Applications.

          If macOS blocks the first launch, Control-click **Subtitle Studio** in
          Applications, choose **Open**, then confirm **Open** once.
          EOF

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            RELEASE_TAG="desktop-latest"
            RELEASE_TITLE="Subtitle Studio for Apple Silicon"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_TITLE="Subtitle Studio $GITHUB_REF_NAME"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/Subtitle-Studio-macOS-arm64.dmg \
              release-assets/Subtitle-Studio-macOS-arm64.sha256 \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-installation.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              release-assets/Subtitle-Studio-macOS-arm64.dmg \
              release-assets/Subtitle-Studio-macOS-arm64.sha256 \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-installation.md \
              --latest
          fi
